services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-api:1.0.0
    container_name: fraud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=America/Lima
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
